<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup Wheel · Polymarket Odds</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>🎡 World Cup Wheel</h1>
    </header>

    <section class="controls">
      <label for="match-select" class="controls__label">Match</label>
      <div class="controls__row">
        <select id="match-select" class="controls__select" disabled>
          <option>Loading matches…</option>
        </select>
        <button id="refresh-btn" class="btn btn--ghost" title="Refresh odds">
          ⟳
        </button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="wheel-area">
      <div class="wheel-slot">
        <div class="wheel-wrap">
          <div class="wheel-pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="520" height="520" role="img"
                  aria-label="Outcome wheel"></canvas>

          <div id="loading" class="loading" hidden>
            <div class="loading__spinner" aria-hidden="true"></div>
            <p class="loading__text">Fetching World Cup odds from Polymarket…</p>
          </div>
        </div>
      </div>

      <div class="legend is-hidden" id="legend"></div>

      <p id="match-desc" class="match-desc is-hidden"></p>

      <button id="spin-btn" class="btn btn--primary" disabled>Spin</button>

      <div id="result" class="result is-hidden">
        <span class="result__label">Result</span>
        <strong id="result-text" class="result__text"></strong>
      </div>
    </section>

    <footer class="app__footer">
      <span id="odds-source" class="odds-source"></span>
      <span class="disclaimer">
        Data from Polymarket (Gamma API). For entertainment purposes only.
      </span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
